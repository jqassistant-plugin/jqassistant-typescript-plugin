---
    name: CI-TypeScript
    
    on:
      push:
        branches:
          - main
        tags-ignore:
          - "*"
        paths-ignore:
          - 'docs/**'
          - 'java/**'
          - 'README.md'
      pull_request:
        branches:
          - main
      workflow_dispatch: {}
    
    concurrency:
      group: build-ts-${{ github.ref }}
      cancel-in-progress: true
    
    jobs:
      typescript-test:
        runs-on: ${{ matrix.os }}
        strategy:
          fail-fast: false
          matrix:
            os: [ ubuntu-latest, windows-latest, macos-latest ]
        steps:
          - uses: actions/checkout@v6
          - name: Setup Node.js (LTS)
            uses: actions/setup-node@v6
            with:
              node-version: 'lts/*'
              registry-url: 'https://registry.npmjs.org'
          - name: Install dependencies
            run: npm ci
            working-directory: ./typescript
          # Jest does not type-check (isolatedModules), so type errors only show up here
          - name: Type-check sources and tests
            run: npm run typecheck
            working-directory: ./typescript
          - name: Build
            run: npm run build
            working-directory: ./typescript
          # The published package is dist/, not the sources the tests run
          - name: Smoke test compiled CLI
            shell: bash
            run: |
              node dist/src/main.js --version
              node dist/src/main.js test/core/integration/sample-projects/class-declarations -e react
              test -s test/core/integration/sample-projects/class-declarations/.reports/jqa/ts-output.json
            working-directory: ./typescript
          - name: Run tests
            run: npm run test
            working-directory: ./typescript
